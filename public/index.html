<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialBoost NGN - Social Media Growth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }
    header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      color: #00e676;
      font-size: 1.8rem;
      font-weight: 700;
    }
    header p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #161f30;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input[type="text"], input[type="number"], input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #0b0f19;
      border: 1px solid #2a3854;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #00e676;
    }
    .meta-info {
      font-size: 0.8rem;
      color: #64748b;
      text-align: right;
    }
    .cost-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cost-box span {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .cost-box strong {
      font-size: 1.5rem;
      color: #00e676;
    }
    .bank-box {
      background: #092019;
      border: 1px solid #134e3a;
      border-radius: 12px;
      padding: 14px;
    }
    .bank-box h4 {
      color: #00e676;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .bank-box p {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #00e676;
      color: #0b0f19;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #00c853;
    }
  </style>
</head>
<body>

  <header>
    <h1>SocialBoost NGN</h1>
    <p>Live rates with instant order processing</p>
  </header>

  <div class="card">
    <div class="form-group">
      <label for="category">Category</label>
      <select id="category"><option>Loading categories...</option></select>
    </div>

    <div class="form-group">
      <label for="service">Service Type</label>
      <select id="service"><option>Select category first</option></select>
    </div>

    <div class="form-group">
      <label for="targetLink">Target Link / Profile URL</label>
      <input type="text" id="targetLink" placeholder="e.g. https://instagram.com/yourprofile" />
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" value="1000" />
      <div class="meta-info" id="minMaxInfo">Min: -- | Max: --</div>
    </div>

    <div class="cost-box">
      <span>Total Cost:</span>
      <strong id="totalCost">₦0</strong>
    </div>

    <div class="bank-box">
      <h4>Bank Transfer Details</h4>
      <p>Bank: <strong>OPay</strong></p>
      <p>Account Number: <strong>9058382070</strong></p>
      <p>Account Name: <strong>Daniel Olabisi</strong></p>
    </div>

    <div class="form-group">
      <label for="receipt">Upload Payment Receipt</label>
      <input type="file" id="receipt" accept="image/*" />
    </div>

    <button class="btn-submit" id="submitBtn">Submit Order & Upload Proof</button>
  </div>

  <script>
    let allServices = [];

    async function loadServices() {
      try {
        const res = await fetch('/api/services');
        allServices = await res.json();

        const categories = [...new Set(allServices.map(s => s.category))];
        const categorySelect = document.getElementById('category');
        categorySelect.innerHTML = '';

        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          categorySelect.appendChild(opt);
        });

        categorySelect.addEventListener('change', updateServiceDropdown);
        updateServiceDropdown();
      } catch (err) {
        alert('Failed to load services.');
      }
    }

    function updateServiceDropdown() {
      const selectedCat = document.getElementById('category').value;
      const serviceSelect = document.getElementById('service');
      serviceSelect.innerHTML = '';

      const filtered = allServices.filter(s => s.category === selectedCat);
      filtered.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `${s.name} - ₦${s.retail_rate_per_1000.toLocaleString()} / 1k`;
        serviceSelect.appendChild(opt);
      });

      serviceSelect.addEventListener('change', calculateTotal);
      document.getElementById('quantity').addEventListener('input', calculateTotal);
      calculateTotal();
    }

    function calculateTotal() {
      const serviceId = document.getElementById('service').value;
      const qty = parseInt(document.getElementById('quantity').value) || 0;
      const selectedService = allServices.find(s => s.id == serviceId);

      if (selectedService) {
        document.getElementById('minMaxInfo').textContent = `Min: ${selectedService.min} | Max: ${selectedService.max}`;
        const total = Math.ceil((qty / 1000) * selectedService.retail_rate_per_1000);
        document.getElementById('totalCost').textContent = `₦${total.toLocaleString()}`;
      }
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const serviceId = document.getElementById('service').value;
      const selectedService = allServices.find(s => s.id == serviceId);
      const link = document.getElementById('targetLink').value;
      const qty = document.getElementById('quantity').value;
      const fileInput = document.getElementById('receipt');

      if (!link || !qty || !fileInput.files[0]) {
        return alert('Please fill in link, quantity, and attach payment receipt.');
      }

      const totalCost = Math.ceil((parseInt(qty) / 1000) * selectedService.retail_rate_per_1000);

      const formData = new FormData();
      formData.append('serviceId', serviceId);
      formData.append('serviceName', selectedService.name);
      formData.append('targetLink', link);
      formData.append('quantity', qty);
      formData.append('totalCost', totalCost);
      formData.append('receipt', fileInput.files[0]);

      try {
        const res = await fetch('/api/orders/create', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          alert(`Order Submitted! Order ID: ${data.orderId}`);
          location.reload();
        } else {
          alert(data.error || 'Submission failed');
        }
      } catch (err) {
        alert('Error submitting order.');
      }
    });

    loadServices();
  </script>
</body>
</html>
