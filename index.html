<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Boost NGN</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

  <!-- Header / Navigation -->
  <nav class="border-b border-slate-800 bg-slate-950 p-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-extrabold text-emerald-400 tracking-wide">SocialBoost NGN</h1>
      <button onclick="toggleView()" id="viewToggleBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-md border border-slate-700 transition">
        Switch to Admin Panel
      </button>
    </div>
  </nav>

  <!-- CUSTOMER ORDER VIEW -->
  <main id="userView" class="max-w-2xl mx-auto p-4 my-6">
    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-2xl space-y-6">
      <div>
        <h2 class="text-2xl font-bold">Boost Your Social Media</h2>
        <p class="text-slate-400 text-sm">Fast delivery & instant order tracking in Naira</p>
      </div>

      <!-- Platform Selection -->
      <div class="grid grid-cols-4 gap-2">
        <button onclick="filterPlatform('facebook')" id="btn-facebook" class="platform-btn bg-emerald-600 font-semibold py-2 rounded-lg text-xs md:text-sm">Facebook</button>
        <button onclick="filterPlatform('tiktok')" id="btn-tiktok" class="platform-btn bg-slate-700 hover:bg-slate-600 font-semibold py-2 rounded-lg text-xs md:text-sm">TikTok</button>
        <button onclick="filterPlatform('instagram')" id="btn-instagram" class="platform-btn bg-slate-700 hover:bg-slate-600 font-semibold py-2 rounded-lg text-xs md:text-sm">Instagram</button>
        <button onclick="filterPlatform('youtube')" id="btn-youtube" class="platform-btn bg-slate-700 hover:bg-slate-600 font-semibold py-2 rounded-lg text-xs md:text-sm">YouTube</button>
      </div>

      <form id="orderForm" onsubmit="handleOrderSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Service Type</label>
          <select id="serviceSelect" onchange="calculatePrice()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500"></select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Target Link / Profile URL</label>
          <input type="text" id="targetLink" required placeholder="e.g. https://facebook.com/yourpage" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Quantity</label>
          <input type="number" id="quantity" value="1000" min="100" oninput="calculatePrice()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Calculated Price Box -->
        <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 flex justify-between items-center">
          <span class="text-slate-400 text-sm">Total Cost:</span>
          <span id="totalPrice" class="text-2xl font-black text-emerald-400">₦0</span>
        </div>

        <!-- OPay Bank Payment Box -->
        <div class="bg-emerald-950/40 border border-emerald-800/60 p-4 rounded-lg space-y-1 text-sm">
          <p class="font-bold text-emerald-400">Bank Transfer Details</p>
          <p class="text-slate-300"><span class="text-slate-400">Bank:</span> OPay</p>
          <p class="text-slate-300"><span class="text-slate-400">Account Number:</span> <strong class="text-white select-all">9058382070</strong></p>
          <p class="text-slate-300"><span class="text-slate-400">Account Name:</span> Daniel Olabisi</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Upload Payment Receipt</label>
          <input type="file" id="receipt" accept="image/*" required class="w-full text-slate-400 bg-slate-900 border border-slate-700 rounded-lg p-2.5">
        </div>

        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-3.5 rounded-lg transition text-base">
          Submit Order & Upload Proof
        </button>
      </form>
    </div>
  </main>

  <!-- ADMIN VIEW -->
  <main id="adminView" class="max-w-5xl mx-auto p-4 my-6 hidden space-y-4">
    <div class="flex justify-between items-center">
      <h2 class="text-2xl font-bold text-emerald-400">Admin Approval Panel</h2>
      <button onclick="loadAdminOrders()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-xs">Refresh Orders</button>
    </div>

    <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead class="bg-slate-950 text-slate-400 border-b border-slate-700">
          <tr>
            <th class="p-3">Order ID</th>
            <th class="p-3">Service</th>
            <th class="p-3">Link / Qty</th>
            <th class="p-3">Total (NGN)</th>
            <th class="p-3">Receipt</th>
            <th class="p-3">Status</th>
            <th class="p-3">Action</th>
          </tr>
        </thead>
        <tbody id="adminOrdersTable" class="divide-y divide-slate-700"></tbody>
      </table>
    </div>
  </main>

  <script>
    let allServices = [];
    let activePlatform = 'facebook';

    async function loadServices() {
      const res = await fetch('/api/services');
      allServices = await res.json();
      filterPlatform('facebook');
    }

    function filterPlatform(platform) {
      activePlatform = platform;
      document.querySelectorAll('.platform-btn').forEach(btn => btn.className = 'platform-btn bg-slate-700 hover:bg-slate-600 font-semibold py-2 rounded-lg text-xs md:text-sm');
      document.getElementById(`btn-${platform}`).className = 'platform-btn bg-emerald-600 font-semibold py-2 rounded-lg text-xs md:text-sm';

      const select = document.getElementById('serviceSelect');
      select.innerHTML = '';
      
      const filtered = allServices.filter(s => s.platform === platform);
      filtered.forEach(s => {
        const option = document.createElement('option');
        option.value = s.id;
        option.innerText = `${s.name} - ₦${s.retail_rate_per_1000.toLocaleString()} / 1k`;
        select.appendChild(option);
      });
      calculatePrice();
    }

    function calculatePrice() {
      const serviceId = document.getElementById('serviceSelect').value;
      const quantity = parseInt(document.getElementById('quantity').value) || 0;
      const service = allServices.find(s => s.id === parseInt(serviceId));

      if (service && quantity > 0) {
        const total = Math.round((service.retail_rate_per_1000 * quantity) / 1000);
        document.getElementById('totalPrice').innerText = `₦${total.toLocaleString()}`;
      }
    }

    async function handleOrderSubmit(e) {
      e.preventDefault();
      const formData = new FormData();
      formData.append('serviceId', document.getElementById('serviceSelect').value);
      formData.append('targetLink', document.getElementById('targetLink').value);
      formData.append('quantity', document.getElementById('quantity').value);
      formData.append('receipt', document.getElementById('receipt').files[0]);

      const res = await fetch('/api/orders/create', { method: 'POST', body: formData });
      const data = await res.json();
      
      if (data.success) {
        alert('Order submitted successfully! Your payment is now pending verification.');
        document.getElementById('orderForm').reset();
        calculatePrice();
      } else {
        alert('Error: ' + data.error);
      }
    }

    function toggleView() {
      const userView = document.getElementById('userView');
      const adminView = document.getElementById('adminView');
      const btn = document.getElementById('viewToggleBtn');

      if (adminView.classList.contains('hidden')) {
        adminView.classList.remove('hidden');
        userView.classList.add('hidden');
        btn.innerText = 'Switch to User View';
        loadAdminOrders();
      } else {
        adminView.classList.add('hidden');
        userView.classList.remove('hidden');
        btn.innerText = 'Switch to Admin Panel';
      }
    }

    async function loadAdminOrders() {
      const res = await fetch('/api/admin/orders');
      const orders = await res.json();
      const tbody = document.getElementById('adminOrdersTable');
      tbody.innerHTML = '';

      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-slate-500">No orders placed yet.</td></tr>';
        return;
      }

      orders.forEach(o => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-750';
        tr.innerHTML = `
          <td class="p-3 font-mono text-xs text-slate-400">${o.orderId}</td>
          <td class="p-3">${o.serviceName}</td>
          <td class="p-3"><a href="${o.targetLink}" target="_blank" class="text-emerald-400 underline">${o.targetLink.substring(0, 22)}...</a> (${o.quantity})</td>
          <td class="p-3 font-bold text-white">₦${o.totalCostNGN.toLocaleString()}</td>
          <td class="p-3"><a href="${o.receiptUrl}" target="_blank" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs text-emerald-300 underline">View Image</a></td>
          <td class="p-3"><span class="px-2 py-1 rounded text-xs ${o.status.includes('Approved') ? 'bg-emerald-900/60 text-emerald-300 border border-emerald-700' : 'bg-amber-900/60 text-amber-300 border border-amber-700'}">${o.status}</span></td>
          <td class="p-3">
            ${o.status === 'Pending Verification' ? `<button onclick="approveOrder('${o.orderId}')" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1 rounded text-xs">Approve & Send API</button>` : '<span class="text-slate-500 text-xs">Completed</span>'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function approveOrder(orderId) {
      if(!confirm('Have you confirmed receipt of transfer in your OPay app?')) return;

      const res = await fetch('/api/admin/approve-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId })
      });
      const data = await res.json();

      if (data.success) {
        alert('Order approved! Automatically forwarded to MySocialsBoost API.');
        loadAdminOrders();
      } else {
        alert('API Error: ' + data.error);
      }
    }

    loadServices();
  </script>
</body>
  </html>
